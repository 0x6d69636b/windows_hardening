name: Finding list safety

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: finding-list-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run finding-list safety tests
        shell: ${{ matrix.shell }}
        run: ./tests/Test-FindingListSafety.ps1
